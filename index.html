<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEEA AI 사내의견 MAP</title>
<style>
:root{
  --bg:#f7f9fc; --panel:#ffffff; --text:#172033; --muted:#697386; --line:#d7deea;
  --accent:#5b4df7; --accent2:#7c3aed; --danger:#e11d48; --ok:#0f9f6e;
  --shadow:0 18px 45px rgba(42,55,92,.14);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.topbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:12px;padding:0 18px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid #e8edf5}
.brand{font-weight:900;letter-spacing:-.04em}.version{font-size:12px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:4px 8px}.spacer{flex:1}.user{font-size:13px;color:var(--muted)}
.ghost{border:1px solid #dce3ef;background:#fff;border-radius:10px;padding:8px 11px;color:#39445b;font-weight:700}

.board-wrap{position:relative;min-height:calc(100vh - 116px);overflow:auto;padding:18px 18px 108px}
#board{position:relative;min-width:1050px;min-height:760px;margin:0 auto;background:radial-gradient(circle at 50% 22%,rgba(109,94,252,.045),transparent 42%)}
#edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;border:2px solid;box-shadow:0 10px 26px rgba(54,66,96,.12);transition:transform .16s,box-shadow .16s,filter .16s;user-select:none;background:#fff;line-height:1.18}
.node:hover{transform:scale(1.035);box-shadow:0 15px 34px rgba(54,66,96,.18)}
.node.selected{box-shadow:0 0 0 8px rgba(91,77,247,.13),0 18px 44px rgba(54,66,96,.24);z-index:4}
.node .title{font-weight:900;letter-spacing:-.035em;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .meta{font-size:10px;margin-top:6px;opacity:.72;white-space:nowrap}
.node.question{border-width:2.5px}.node.opinion{border-width:2px}
.node.q-small{width:126px;height:126px}.node.q-medium{width:158px;height:158px}.node.q-large{width:190px;height:190px}
.node.q-small .title{font-size:16px}.node.q-medium .title{font-size:18px}.node.q-large .title{font-size:20px}
.node.o-small{width:92px;height:92px}.node.o-medium{width:112px;height:112px}.node.o-large{width:132px;height:132px}
.node.o-small .title{font-size:13px}.node.o-medium .title{font-size:14px}.node.o-large .title{font-size:15px}
.node .count{position:absolute;right:-2px;top:-4px;background:#172033;color:#fff;font-size:10px;font-weight:900;border-radius:999px;min-width:23px;height:23px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;padding:0 5px}

.empty{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;color:#8a94a7}.empty b{display:block;color:#536079;margin-bottom:7px}

.composer{position:fixed;z-index:30;left:50%;bottom:18px;transform:translateX(-50%);width:min(920px,calc(100vw - 28px));background:rgba(255,255,255,.97);box-shadow:0 15px 50px rgba(30,42,73,.18);border:1px solid #e1e7f0;border-radius:18px;padding:10px;display:flex;gap:9px;align-items:center}
.mode{display:flex;gap:4px;background:#f0f3f9;padding:4px;border-radius:12px;flex:0 0 auto}.mode button{border:0;background:transparent;border-radius:9px;padding:9px 11px;color:#667085;font-weight:800}.mode button.active{background:#fff;color:#3329c8;box-shadow:0 2px 9px rgba(40,50,90,.11)}
.selected-chip{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:800;color:#5b4df7;background:#efedff;border-radius:10px;padding:9px 10px}.composer input{min-width:0;flex:1;border:0;outline:0;background:#fff;padding:10px 6px;font-size:14px}.send{border:0;background:linear-gradient(135deg,#5b4df7,#7c3aed);color:#fff;font-weight:900;border-radius:12px;padding:11px 16px;min-width:76px}.send:disabled{opacity:.55;cursor:wait}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(18,25,44,.38);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:var(--shadow);padding:26px}.card h1{font-size:22px;margin:0 0 5px}.card p{color:var(--muted);font-size:13px;margin:0 0 20px}.tabs{display:flex;gap:5px;background:#f2f5fa;border-radius:12px;padding:4px;margin-bottom:14px}.tabs button{flex:1;border:0;border-radius:9px;padding:9px;background:transparent;font-weight:800;color:#6f788b}.tabs button.active{background:#fff;color:#4437d8;box-shadow:0 2px 8px rgba(40,50,90,.09)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:800;color:#5c667b}.field input{border:1px solid #dce3ef;border-radius:11px;padding:12px 13px;outline:none}.field input:focus{border-color:#8177fa;box-shadow:0 0 0 3px rgba(91,77,247,.1)}.primary{width:100%;border:0;background:#5b4df7;color:#fff;border-radius:12px;padding:12px;font-weight:900;margin-top:10px}.error{color:#c81e4b;font-size:12px;min-height:18px;margin-top:7px}

.modal{position:fixed;inset:0;z-index:45;background:rgba(17,24,39,.35);display:flex;align-items:center;justify-content:center;padding:20px}.modal-box{width:min(610px,100%);max-height:min(82vh,760px);overflow:auto;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:22px;position:relative}.close{position:absolute;right:14px;top:14px;border:0;background:#f1f4f8;color:#5c667b;width:34px;height:34px;border-radius:50%;font-size:19px}.modal h2{font-size:21px;margin:0 45px 7px 0;letter-spacing:-.04em}.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}.tag{background:#f1efff;color:#5649db;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.section{border-top:1px solid #edf0f5;padding-top:14px;margin-top:14px}.section h3{font-size:13px;margin:0 0 10px;color:#566176}.bodytext{white-space:pre-wrap;line-height:1.58;font-size:14px}.contrib{background:#f8fafc;border:1px solid #edf1f6;border-radius:12px;padding:11px;margin:7px 0}.contrib b{font-size:11px;color:#697386}.contrib div{margin-top:5px;font-size:13px;line-height:1.45}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.btn{border:1px solid #d9e0eb;background:#fff;border-radius:10px;padding:9px 11px;font-weight:800;color:#455067}.btn.purple{background:#5b4df7;border-color:#5b4df7;color:#fff}.btn.danger{color:#d31e4b;border-color:#f2c8d4}.btn:disabled{opacity:.55}.sizegroup{display:flex;gap:6px}.sizegroup .btn.active{background:#eeeaff;border-color:#8478fb;color:#4c3fd6}.relitem{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #e7ebf2;font-size:13px}

.toast{position:fixed;z-index:80;left:50%;top:74px;transform:translateX(-50%);background:#172033;color:#fff;border-radius:11px;padding:10px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.toast.bad{background:#b42348}
.loader{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;display:inline-block;vertical-align:-3px;margin-right:6px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:720px){.topbar{padding:0 10px}.brand{font-size:14px}.user{display:none}.board-wrap{padding-left:8px;padding-right:8px}.composer{bottom:10px;gap:6px;padding:8px}.selected-chip{display:none}.mode button{padding:8px 9px;font-size:12px}.send{min-width:62px;padding:10px 11px}.node.q-large{width:170px;height:170px}.node.q-medium{width:148px;height:148px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">한국전기기술인협회 AI 사내의견 MAP</div><span class="version">v5.3+</span>
  <div class="spacer"></div><span class="user" id="userLabel"></span><button class="ghost" id="logoutBtn">로그아웃</button>
</header>
<div class="board-wrap"><main id="board"><svg id="edges"></svg><div id="empty" class="empty hidden"><b>아직 등록된 노트가 없습니다.</b>하단 입력창에서 공지 또는 의견을 추가해 주세요.</div></main></div>

<div class="composer" id="composer">
  <div class="mode"><button id="modeQuestion">공지</button><button id="modeOpinion" class="active">의견</button></div>
  <div id="selectedChip" class="selected-chip hidden"></div>
  <input id="nodeInput" maxlength="1000" autocomplete="off" placeholder="의견을 입력하세요. 공지를 선택하면 해당 공지에 연결됩니다.">
  <button id="sendBtn" class="send">등록</button>
</div>

<div id="auth" class="overlay">
  <div class="card">
    <h1>사내의견 MAP</h1><p>로그인 후 공동 의견 지도를 사용할 수 있습니다.</p>
    <div class="tabs"><button id="loginTab" class="active">로그인</button><button id="registerTab">새 계정</button></div>
    <div class="field"><label>이름</label><input id="authName" autocomplete="username" maxlength="40"></div>
    <div class="field"><label>비밀번호</label><input id="authPass" type="password" autocomplete="current-password"></div>
    <button id="authSubmit" class="primary">로그인</button><div class="error" id="authError"></div>
  </div>
</div>

<div id="detailModal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><div id="detailBody"></div></div></div>
<div id="toast" class="toast"></div>

<script>
const state={nodes:[],me:null,mode:'opinion',selectedQuestion:null,busy:false,authMode:'login'};
const board=document.getElementById('board'), edges=document.getElementById('edges'), input=document.getElementById('nodeInput');
const qPalette=[['#6d28d9','#f1e9ff'],['#d59a00','#fff7e5'],['#0891b2','#e9faff'],['#dc267f','#fff0f7'],['#2563eb','#eef4ff'],['#0f9f6e','#ecfbf5'],['#9333ea','#f7efff']];
const oPalette=[['#4f46e5','#eef0ff'],['#e11d72','#fff0f6'],['#06a8c7','#eefbfe'],['#16a34a','#effcf3'],['#ea8b00','#fff8e7'],['#8b5cf6','#f4f0ff'],['#db2777','#fff0f7'],['#2563eb','#edf4ff']];
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function api(url,opt={}){return fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt}).then(async r=>{let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||`요청 실패 (${r.status})`);e.status=r.status;throw e}return d})}
function toast(msg,bad=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(toast._t);toast._t=setTimeout(()=>t.className='toast',2500)}
function hash(s){let h=0;for(const c of String(s))h=((h<<5)-h+c.charCodeAt(0))|0;return Math.abs(h)}
function nodeById(id){return state.nodes.find(n=>n.id===id)}
function sizeFor(n){if(n.kind==='question')return n.display_size||'medium';const c=Number(n.support_count||1);return c>=6?'large':c>=3?'medium':'small'}
function diameter(n){if(n.kind==='question')return {small:126,medium:158,large:190}[sizeFor(n)];return {small:92,medium:112,large:132}[sizeFor(n)]}
function setMode(m){state.mode=m;document.getElementById('modeQuestion').classList.toggle('active',m==='question');document.getElementById('modeOpinion').classList.toggle('active',m==='opinion');input.placeholder=m==='question'?'새 공지 내용을 입력하세요.':'의견을 입력하세요. 공지를 선택하면 해당 공지에 연결됩니다.';updateChip()}
function updateChip(){const chip=document.getElementById('selectedChip');if(state.mode==='opinion'&&state.selectedQuestion){const q=nodeById(state.selectedQuestion);if(q){chip.textContent='연결: '+q.title;chip.classList.remove('hidden');return}}chip.classList.add('hidden')}
async function loadMe(){try{state.me=await api('/api/me');document.getElementById('auth').classList.add('hidden');document.getElementById('userLabel').textContent=state.me.username+(state.me.is_admin?' · 관리자':'');await loadNodes()}catch{document.getElementById('auth').classList.remove('hidden')}}
async function loadNodes(){try{state.nodes=await api('/api/nodes');if(state.selectedQuestion&&!nodeById(state.selectedQuestion))state.selectedQuestion=null;render();updateChip()}catch(e){if(e.status===401){state.me=null;document.getElementById('auth').classList.remove('hidden')}else toast(e.message,true)}}

function computeLayout(){
  const questions=state.nodes.filter(n=>n.kind==='question');
  const unattached=state.nodes.filter(n=>n.kind==='opinion'&&!n.parent_id);
  const positions={};
  const cols=Math.max(2,Math.min(4,Math.ceil(Math.sqrt(Math.max(questions.length,1)))));
  const cellW=480,cellH=420,marginX=100,marginY=100;
  questions.forEach((q,i)=>{
    const cx=marginX+(i%cols)*cellW+cellW/2, cy=marginY+Math.floor(i/cols)*cellH+cellH/2;
    const qd=diameter(q);positions[q.id]={x:cx-qd/2,y:cy-qd/2,cx,cy,d:qd};
    const kids=state.nodes.filter(n=>n.kind==='opinion'&&n.parent_id===q.id);
    kids.forEach((n,j)=>{
      const ring=Math.floor(j/6), idx=j%6, count=Math.min(6,kids.length-ring*6);
      const radius=qd/2+105+ring*110; const angle=-Math.PI/2+(Math.PI*2*idx/Math.max(count,1))+(ring%2?Math.PI/6:0);
      const d=diameter(n), ncx=cx+Math.cos(angle)*radius,ncy=cy+Math.sin(angle)*radius;
      positions[n.id]={x:ncx-d/2,y:ncy-d/2,cx:ncx,cy:ncy,d};
    });
  });
  const qRows=Math.max(1,Math.ceil(Math.max(questions.length,1)/cols));
  const looseY=marginY+qRows*cellH+120;
  unattached.forEach((n,i)=>{const d=diameter(n),cx=marginX+120+(i%Math.max(4,cols*2))*190,cy=looseY+Math.floor(i/Math.max(4,cols*2))*170;positions[n.id]={x:cx-d/2,y:cy-d/2,cx,cy,d}});
  let maxX=1050,maxY=720;Object.values(positions).forEach(p=>{maxX=Math.max(maxX,p.x+p.d+120);maxY=Math.max(maxY,p.y+p.d+130)});
  return {positions,width:maxX,height:maxY};
}
function render(){
  board.querySelectorAll('.node').forEach(n=>n.remove());
  const {positions,width,height}=computeLayout();board.style.width=width+'px';board.style.height=height+'px';edges.setAttribute('viewBox',`0 0 ${width} ${height}`);edges.innerHTML='';
  document.getElementById('empty').classList.toggle('hidden',state.nodes.length!==0);
  const drawn=new Set();
  function line(a,b,type='related'){
    const pa=positions[a],pb=positions[b];if(!pa||!pb)return;const key=[a,b].sort().join('|');if(drawn.has(key))return;drawn.add(key);
    const l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',pa.cx);l.setAttribute('y1',pa.cy);l.setAttribute('x2',pb.cx);l.setAttribute('y2',pb.cy);l.setAttribute('stroke',type==='parent'?'#8b5cf6':'#c5ccda');l.setAttribute('stroke-width',type==='parent'?'2.4':'1.5');if(type!=='parent')l.setAttribute('stroke-dasharray','5 5');l.setAttribute('opacity',type==='parent'?'.9':'.75');edges.appendChild(l)
  }
  state.nodes.forEach(n=>{if(n.parent_id)line(n.id,n.parent_id,'parent');(n.related||[]).forEach(r=>line(n.id,r,'related'))});
  state.nodes.forEach((n,i)=>{
    const p=positions[n.id];if(!p)return;const el=document.createElement('button');const size=sizeFor(n);el.className=`node ${n.kind} ${n.kind==='question'?'q':'o'}-${size}`+(state.selectedQuestion===n.id?' selected':'');el.style.left=p.x+'px';el.style.top=p.y+'px';
    const pal=(n.kind==='question'?qPalette:oPalette)[hash(n.id)%(n.kind==='question'?qPalette:oPalette).length];el.style.borderColor=pal[0];el.style.background=pal[1];el.style.color=pal[0];
    el.innerHTML=`<div><div class="title">${esc(n.title)}</div><div class="meta">${n.kind==='question'?'공지':`의견 · ${Number(n.support_count||1)}명`}</div></div>${n.kind==='opinion'&&Number(n.support_count||1)>1?`<span class="count">${Number(n.support_count)}</span>`:''}`;
    el.addEventListener('click',e=>{e.stopPropagation();if(n.kind==='question'){state.selectedQuestion=state.selectedQuestion===n.id?null:n.id;setMode('opinion');render();updateChip()}else openDetail(n.id)});
    el.addEventListener('dblclick',e=>{e.stopPropagation();openDetail(n.id)});el.title=n.kind==='question'?'클릭: 의견 연결 공지 선택 · 더블클릭: 상세':'클릭: 상세';board.appendChild(el)
  });
}
board.addEventListener('click',()=>{if(state.selectedQuestion){state.selectedQuestion=null;render();updateChip()}});

async function submitNode(){
  const text=input.value.trim();if(!text||state.busy)return;state.busy=true;const btn=document.getElementById('sendBtn');btn.disabled=true;btn.innerHTML='<span class="loader"></span>분석';
  try{
    const parent=state.mode==='opinion'&&state.selectedQuestion?nodeById(state.selectedQuestion):null;
    const analysis=await api('/api/analyze',{method:'POST',body:JSON.stringify({text,kind:state.mode,parent_question:parent})});
    const result=await api('/api/nodes',{method:'POST',body:JSON.stringify({text,kind:state.mode,analysis,parent_id:parent?.id||null})});
    input.value='';await loadNodes();
    if(result.duplicate)toast('같은 작성자의 동일 의견은 이미 반영되어 있습니다.');else if(result.merged)toast('기존 동일 정책 의견에 합쳤습니다.');else toast('노트를 등록했습니다.');
  }catch(e){toast(e.message,true)}finally{state.busy=false;btn.disabled=false;btn.textContent='등록'}
}

document.getElementById('sendBtn').onclick=submitNode;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitNode()}});document.getElementById('modeQuestion').onclick=()=>setMode('question');document.getElementById('modeOpinion').onclick=()=>setMode('opinion');

function openDetail(id){
  const n=nodeById(id);if(!n)return;const rel=(n.related||[]).map(nodeById).filter(Boolean);let html=`<h2>${esc(n.title)}</h2><div class="tagrow"><span class="tag">${n.kind==='question'?'공지 노트':'의견 노트'}</span><span class="tag">${esc(n.category||'기타')}</span>${(n.keywords||[]).map(k=>`<span class="tag">#${esc(k)}</span>`).join('')}</div><div class="section"><h3>원문</h3><div class="bodytext">${esc(n.text)}</div></div>`;
  if(n.kind==='opinion')html+=`<div class="section"><h3>작성자별 의견 · ${Number(n.support_count||1)}명</h3>${(n.opinions||[]).map(o=>`<div class="contrib"><b>${esc(o.author)}</b><div>${esc(o.text)}</div></div>`).join('')||'<div class="bodytext">의견 원문이 없습니다.</div>'}</div>`;
  if(rel.length)html+=`<div class="section"><h3>관련 노트</h3>${rel.map(r=>`<div class="relitem"><span>${esc(r.title)}</span>${n.kind==='opinion'&&r.kind==='opinion'?`<button class="btn unlink" data-a="${esc(n.id)}" data-b="${esc(r.id)}">연결 해제</button>`:''}</div>`).join('')}</div>`;
  html+='<div class="actions">';
  if(n.kind==='question'&&n.can_resize)html+=`<div class="sizegroup"><button class="btn sizebtn ${n.display_size==='small'?'active':''}" data-size="small">소</button><button class="btn sizebtn ${n.display_size==='medium'?'active':''}" data-size="medium">중</button><button class="btn sizebtn ${n.display_size==='large'?'active':''}" data-size="large">대</button></div>`;
  if(n.kind==='question'&&n.display_size==='large')html+=`<button class="btn" id="exportBtn">엑셀 저장</button>`;
  if(n.kind==='opinion')html+=`<button class="btn purple" id="reclassifyBtn">AI 재분류</button>`;
  if(n.can_delete)html+=`<button class="btn danger" id="deleteBtn">${n.kind==='opinion'&&!state.me?.is_admin?'내 의견 삭제':'노트 삭제'}</button>`;
  html+='</div>';document.getElementById('detailBody').innerHTML=html;document.getElementById('detailModal').classList.remove('hidden');
  document.querySelectorAll('.sizebtn').forEach(b=>b.onclick=()=>resizeNode(n.id,b.dataset.size));document.querySelectorAll('.unlink').forEach(b=>b.onclick=()=>unlink(b.dataset.a,b.dataset.b));
  document.getElementById('reclassifyBtn')?.addEventListener('click',()=>reclassify(n.id));document.getElementById('deleteBtn')?.addEventListener('click',()=>deleteNode(n));document.getElementById('exportBtn')?.addEventListener('click',()=>{window.location=`/api/nodes/${encodeURIComponent(n.id)}/export.xlsx`});
}
function closeModal(){document.getElementById('detailModal').classList.add('hidden')}document.getElementById('closeModal').onclick=closeModal;document.getElementById('detailModal').addEventListener('click',e=>{if(e.target.id==='detailModal')closeModal()});
async function resizeNode(id,size){try{await api(`/api/nodes/${encodeURIComponent(id)}/size`,{method:'PATCH',body:JSON.stringify({size})});await loadNodes();closeModal();openDetail(id);toast('공지 크기를 변경했습니다.')}catch(e){toast(e.message,true)}}
async function unlink(a,b){if(!confirm('이 의견 노드 간 일반 연결을 해제할까요?'))return;try{await api('/api/connections',{method:'DELETE',body:JSON.stringify({a,b})});closeModal();await loadNodes();toast('연결을 해제했습니다.')}catch(e){toast(e.message,true)}}
async function reclassify(id){const btn=document.getElementById('reclassifyBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="loader"></span>분류 중'}try{const r=await api(`/api/nodes/${encodeURIComponent(id)}/reclassify`,{method:'POST',body:'{}'});closeModal();await loadNodes();toast(r.message||(`재분류 완료 · ${r.groups||1}개 그룹`))}catch(e){toast(e.message,true);if(btn){btn.disabled=false;btn.textContent='AI 재분류'}}}
async function deleteNode(n){const msg=n.kind==='question'?'이 공지와 소속 의견을 함께 삭제할까요?':(state.me?.is_admin?'이 의견 노트 전체를 삭제할까요?':'이 노트에서 내가 작성한 의견을 삭제할까요?');if(!confirm(msg))return;try{await api(`/api/nodes/${encodeURIComponent(n.id)}`,{method:'DELETE'});closeModal();await loadNodes();toast('삭제했습니다.')}catch(e){toast(e.message,true)}}

function setAuthMode(m){state.authMode=m;document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('registerTab').classList.toggle('active',m==='register');document.getElementById('authSubmit').textContent=m==='login'?'로그인':'계정 만들기';document.getElementById('authError').textContent='';document.getElementById('authPass').autocomplete=m==='login'?'current-password':'new-password'}
document.getElementById('loginTab').onclick=()=>setAuthMode('login');document.getElementById('registerTab').onclick=()=>setAuthMode('register');document.getElementById('authSubmit').onclick=authSubmit;document.getElementById('authPass').addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit()});
async function authSubmit(){const username=document.getElementById('authName').value.trim(),password=document.getElementById('authPass').value,err=document.getElementById('authError');err.textContent='';try{state.me=await api(state.authMode==='login'?'/api/login':'/api/register',{method:'POST',body:JSON.stringify({username,password})});document.getElementById('auth').classList.add('hidden');document.getElementById('userLabel').textContent=state.me.username+(state.me.is_admin?' · 관리자':'');await loadNodes()}catch(e){err.textContent=e.message}}
document.getElementById('logoutBtn').onclick=async()=>{try{await api('/api/logout',{method:'POST',body:'{}'})}catch{}state.me=null;state.nodes=[];render();document.getElementById('auth').classList.remove('hidden')};

window.addEventListener('resize',()=>render());setMode('opinion');loadMe();
</script>
</body>
</html>
