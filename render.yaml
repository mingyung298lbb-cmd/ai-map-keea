services:
  - type: web
    name: keea-opinion-map
    runtime: python
    plan: starter
    buildCommand: pip install Flask requests openpyxl gunicorn
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    disk:
      name: keea-opinion-map-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/opinion_map.db
      -
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_URL
        value: https://실제-Ollama-서버주소/api/chat
      - key: OLLAMA_MODEL
        value: qwen2.5:3b
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
